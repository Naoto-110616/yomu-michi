name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    name: ビルドして Cloudflare Workers へ配信
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install numpy
      - run: npm install

      # data/graph.json は pipeline/sources から毎回生成する
      - name: グラフを生成
        run: npm run data

      # Cloudflare はルート配信なので basePath は付けない
      - name: 静的書き出し
        run: npm run build

      - name: Workers へデプロイ
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
