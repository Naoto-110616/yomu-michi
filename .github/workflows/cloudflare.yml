name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    name: ビルドして Cloudflare Workers へ配信
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install numpy
      - run: npm install

      # data/graph.json は pipeline/sources から毎回生成する
      - name: グラフを生成
        run: npm run data

      # Cloudflare はルート配信なので basePath は付けない
      - name: 静的書き出し
        run: npm run build

      - name: Workers へデプロイ
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # 公開URLは実行ログにしか残らないので、API から組み立てて
      # リポジトリ（DEPLOY_URL.md）とジョブサマリの両方に記録する
      - name: 公開URLを記録して疎通確認
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          sub=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/subdomain" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print((d.get('result') or {}).get('subdomain',''))")

          if [ -z "$sub" ]; then
            echo "::warning::workers.dev のサブドメインを取得できませんでした"
            sub="UNKNOWN"
          fi
          url="https://yomu-michi.${sub}.workers.dev"

          code=$(curl -sS -o /tmp/body.html -w '%{http_code}' -L "$url" --max-time 30 || echo 000)
          size=$(wc -c < /tmp/body.html || echo 0)
          echo "URL : $url"
          echo "HTTP: $code (${size} bytes)"

          {
            echo "### 公開URL"
            echo ""
            echo "$url"
            echo ""
            echo "疎通確認: HTTP \`$code\` / \`${size}\` bytes"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "# 公開URL"
            echo ""
            echo "<$url>"
            echo ""
            echo "- 最終デプロイ: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- 疎通確認: HTTP \`$code\` / \`${size}\` bytes"
          } > DEPLOY_URL.md

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- DEPLOY_URL.md
          if ! git diff --cached --quiet; then
            git commit -m "公開URLを記録 [skip ci]"
            git push
          fi
