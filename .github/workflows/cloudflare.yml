name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    name: ビルドして Cloudflare Workers へ配信
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install numpy
      - run: npm install

      # data/graph.json は pipeline/sources から毎回生成する
      - name: グラフを生成
        run: npm run data

      # Cloudflare はルート配信なので basePath は付けない
      - name: 静的書き出し
        run: npm run build

      - name: Workers へデプロイ
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # 公開URLは実行ログにしか出ないので、リポジトリからも辿れるように残す
      - name: 公開URLを記録
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "### 公開URL" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$URL" > DEPLOY_URL.md
          if ! git diff --quiet -- DEPLOY_URL.md; then
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add DEPLOY_URL.md
            git commit -m "公開URLを更新 [skip ci]"
            git push
          fi
