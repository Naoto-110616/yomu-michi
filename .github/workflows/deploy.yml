name: Build & Deploy Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: ビルド（データ生成 → 静的書き出し）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install numpy
      - run: npm install

      # data/graph.json は pipeline/sources から毎回生成する。
      # 乱数はシード固定なので、何度ビルドしても同じ座標＝同じ地図になる。
      - name: グラフを生成
        run: npm run data

      - name: 静的書き出し
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /yomu-michi

      # Jekyll に _next/ を無視されないようにする
      - run: touch out/.nojekyll

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-static
          path: ./out
          retention-days: 7

      # gh-pages ブランチに配信。Pages のソースがこのブランチになっていれば
      # push しただけで公開される（GITHUB_TOKEN の contents:write だけで足りる）。
      - name: gh-pages へ配信
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'Atlas を更新'
