name: Deploy Atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # configure-pages の enablement:true が "Resource not accessible by integration" で
      # 落ちるケースがあるため、先に REST を直接叩いて Pages サイトを作りに行く。
      # 既に有効なら 409 が返るだけなので、失敗しても続行する。
      - name: Enable GitHub Pages (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "POST /pages -> $code"
          cat /tmp/pages.json
          if [ "$code" = "409" ] || [ "$code" = "201" ]; then
            echo "Pages is available."
          else
            echo "::warning::Pages could not be enabled automatically (HTTP $code). Settings > Pages > Source = GitHub Actions を一度だけ手動で設定してください。"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - run: npm install
      # data/graph.json は pipeline/sources から毎回生成する
      # （乱数はシード固定なので、何度ビルドしても同じ地図になる）
      - run: npm run data
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /yomu-michi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
